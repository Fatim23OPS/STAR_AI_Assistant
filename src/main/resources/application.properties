spring.application.name=star-assistant
# Connexion a la base de donnees PostgreSQL (Docker)
spring.datasource.url=jdbc:postgresql://localhost:5432/star_db
spring.datasource.username=star_admin
spring.datasource.password=star_password
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuration de la gestion des tables (JPA/Hibernate)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
